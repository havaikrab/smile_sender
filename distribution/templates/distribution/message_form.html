{% extends 'base.html' %}

{% load crispy_forms_tags %}

{% block header %}
    {% if object %}
        <h1 class="text-center sp-bfc mt-5 fw-bold">Редактирование письма №{{object.pk}}</h1>
    {% else %}
        <h1 class="text-center sp-bfc mt-5 fw-bold">Новое письмо</h1>
    {% endif %}
{% endblock %}

{% block content %}
    <form class="sp-cont px-5 py-4 mt-5 me-5" method="post">
        {% csrf_token %}
        {% crispy form %}
    </form>
{% endblock %}
